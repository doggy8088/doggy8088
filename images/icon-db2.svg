<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <rect width="48" height="48" rx="10" fill="#242938"/>
  <defs>
    <linearGradient id="ibm_db2_cyl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78A9FF"/>
      <stop offset="35%" stop-color="#0F62FE"/>
      <stop offset="100%" stop-color="#002D9C"/>
    </linearGradient>
    <linearGradient id="ibm_badge_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F62FE"/>
      <stop offset="100%" stop-color="#0043CE"/>
    </linearGradient>
  </defs>
  
  <!-- IBM Carbon DB2 Database Cylinder (Centered Top) -->
  <g transform="translate(13, 4) scale(0.6875)">
    <!-- 3D Database Cylinder Body -->
    <path d="M16 3 C10.7 3 5 4.25 5 7 V25 C5 27.75 10.7 29 16 29 S27 27.75 27 25 V7 C27 4.25 21.3 3 16 3 Z" fill="url(#ibm_db2_cyl)"/>
    <!-- Top Cap Ellipse -->
    <ellipse cx="16" cy="7" rx="10.5" ry="3.5" fill="#A6C8FF"/>
    <ellipse cx="16" cy="6.6" rx="9.5" ry="3" fill="#D0E2FF"/>
    <!-- Segment Division 1 -->
    <path d="M5.5 13 C7.5 14.2 11.5 15 16 15 S24.5 14.2 26.5 13" fill="none" stroke="#242938" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M5.5 13.8 C7.5 15 11.5 15.8 16 15.8 S24.5 15 26.5 13.8" fill="none" stroke="#A6C8FF" stroke-width="0.8" stroke-linecap="round"/>
    <!-- Segment Division 2 -->
    <path d="M5.5 19 C7.5 20.2 11.5 21 16 21 S24.5 20.2 26.5 19" fill="none" stroke="#242938" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M5.5 19.8 C7.5 21 11.5 21.8 16 21.8 S24.5 21 26.5 19.8" fill="none" stroke="#A6C8FF" stroke-width="0.8" stroke-linecap="round"/>
    <!-- Bottom Rim Highlight -->
    <path d="M5.5 25 C7.5 26.2 11.5 27 16 27 S24.5 26.2 26.5 25" fill="none" stroke="#4589FF" stroke-width="0.8" stroke-linecap="round"/>
  </g>

  <!-- Clean IBM Db2 Product Badge -->
  <rect x="5" y="27" width="38" height="16" rx="4" fill="url(#ibm_badge_grad)"/>
  <text x="24" y="38.5" font-family="-apple-system,BlinkMacSystemFont,'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="8.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">IBM Db2</text>
</svg>
